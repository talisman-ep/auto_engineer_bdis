x-mongo-node: &mongo-node
  image: mongo:7
  networks:
    - auto-net
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 10s

services:
  configsvr:
    <<: *mongo-node
    command: ["mongod", "--configsvr", "--replSet", "rsConfig", "--port", "27017", "--bind_ip_all", "--dbpath", "/data/configdb", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - config_data:/data/configdb

  shard1:
    <<: *mongo-node
    command: ["mongod", "--shardsvr", "--replSet", "rsShard1", "--port", "27017", "--bind_ip_all", "--dbpath", "/data/db", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard1_data:/data/db

  shard2:
    <<: *mongo-node
    command: ["mongod", "--shardsvr", "--replSet", "rsShard2", "--port", "27017", "--bind_ip_all", "--dbpath", "/data/db", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard2_data:/data/db

  shard3:
    <<: *mongo-node
    command: ["mongod", "--shardsvr", "--replSet", "rsShard3", "--port", "27017", "--bind_ip_all", "--dbpath", "/data/db", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard3_data:/data/db

  mongo:
    <<: *mongo-node
    container_name: auto-mongo
    command: ["mongos", "--configdb", "rsConfig/configsvr:27017", "--port", "27017", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    depends_on:
      configsvr:
        condition: service_healthy
    restart: on-failure

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - auto-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    networks:
      - auto-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: auto-backend
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "backend.presentation.api:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      mongo:
        condition: service_healthy
      shard1:
        condition: service_healthy
      shard2:
        condition: service_healthy
      shard3:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - MONGO_DSN=mongodb://mongo:27017
      - ES_URL=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
    networks:
      - auto-net

volumes:
  config_data:
  shard1_data:
  shard2_data:
  shard3_data:
  es_data:

networks:
  auto-net:
    driver: bridge